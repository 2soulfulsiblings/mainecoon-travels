name: Daily TikTok Viral Tracker

on:
  schedule:
    # Runs every day at 9:00 AM Eastern (2:00 PM UTC)
    - cron: "0 14 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Use sample data instead of live TikTok API"
        required: false
        default: "false"
        type: choice
        options:
          - "true"
          - "false"

permissions:
  contents: write  # needed to commit the daily report back to the repo

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install chromium --with-deps

      - name: Run tracker (live)
        if: ${{ github.event.inputs.dry_run != 'true' }}
        env:
          TIKTOK_MS_TOKEN: ${{ secrets.TIKTOK_MS_TOKEN }}
        run: python run_daily.py

      - name: Run tracker (dry run / sample data)
        if: ${{ github.event.inputs.dry_run == 'true' || github.event.inputs.dry_run == '' }}
        run: python run_daily.py --dry-run

      - name: Commit and push daily report
        run: |
          git config user.name  "Traveling Maine Coons Bot"
          git config user.email "cait@reedsbeadsbeyond.com"
          git add reports/
          # Only commit if there are changes
          git diff --cached --quiet || git commit -m "chore: daily TikTok report $(date +%Y-%m-%d)"
          git push origin main
